<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedBot</title>
  <meta name="description" content="Agrégalo al servidor y pruébalo con tu propia comunidad.">
  <meta name="theme-color" content="#ff383d">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://redbot.me/invite">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph -->
  <meta property="og:title" content="RedBot">
  <meta property="og:description" content="Agrégalo al servidor y pruébalo con tu propia comunidad.">
  <meta property="og:image" content="https://redbot.me/og-image.png">
  <meta property="og:url" content="https://redbot.me/invite">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RedBot">
  <meta name="twitter:description" content="Agrégalo al servidor y pruébalo con tu propia comunidad.">
  <meta name="twitter:image" content="https://redbot.me/og-image.png">

  <!-- Redirección automática a Discord OAuth2 -->
  <meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=1020772849906098186&permissions=1125902121552960&integration_type=0&scope=bot+applications.commands+identify&response_type=code&redirect_uri=https%3A%2F%2Fredbot.me%2Fapi%2Foauth%2Fcallback">
  <script>
    location.replace("https://discord.com/oauth2/authorize?client_id=1020772849906098186&permissions=1125902121552960&integration_type=0&scope=bot+applications.commands+identify&response_type=code&redirect_uri=https%3A%2F%2Fredbot.me%2Fapi%2Foauth%2Fcallback");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .redirect-card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
    }
    .redirect-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: block;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="/android-chrome-192x192.png" alt="RedBot" class="redirect-logo">
    <h1 id="invite-title">Redirigiendo a Discord...</h1>
    <p id="invite-desc">Si la ventana de autorización no se abre automáticamente en unos segundos, puedes continuar pulsando el botón a continuación:</p>
    <a id="invite-btn" class="btn btn-primary" href="https://discord.com/oauth2/authorize?client_id=1020772849906098186&permissions=1125902121552960&integration_type=0&scope=bot+applications.commands+identify&response_type=code&redirect_uri=https%3A%2F%2Fredbot.me%2Fapi%2Foauth%2Fcallback">
      Autorizar en Servidor
    </a>
  </div>
  <script>
    (function () {
      try {
        var param = new URLSearchParams(window.location.search).get('lang');
        var saved = localStorage.getItem('redbot_lang');
        var navLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        var lang = (param || saved || navLang).toLowerCase();
        if (lang.indexOf('en') === 0) {
          document.documentElement.lang = 'en';
          document.title = 'RedBot - Invite to Discord';
          document.getElementById('invite-title').textContent = 'Redirecting to Discord...';
          document.getElementById('invite-desc').textContent = 'If the authorization window does not open automatically in a few seconds, you can continue by clicking the button below:';
          document.getElementById('invite-btn').textContent = 'Add to Server';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
