<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitar a RedBot</title>
  <meta name="description" content="Imagina un bot simple e intuitivo. Sin configuraciones complejas y operativo desde la primera instalación.">
  <meta name="theme-color" content="#ff383d">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://redbot.me/invite">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph / Discord Embed -->
  <meta property="og:title" content="RedBot">
  <meta property="og:description" content="Imagina un bot simple e intuitivo. Sin configuraciones complejas y operativo desde la primera instalación.">
  <meta property="og:image" content="https://redbot.me/redbot.png">
  <meta property="og:url" content="https://redbot.me/invite">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="RedBot">
  <meta name="twitter:description" content="Imagina un bot simple e intuitivo. Sin configuraciones complejas y operativo desde la primera instalación.">
  <meta name="twitter:image" content="https://redbot.me/redbot.png">

  <!-- Redirección automática a Discord OAuth2 -->
  <meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=1020772849906098186">
  <script>
    location.replace("https://discord.com/oauth2/authorize?client_id=1020772849906098186");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #121212;
      --surface: #1e1e1e;
      --line: #333333;
      --text: #e0e0e0;
      --text-dim: #999999;
      --signal: #c9302c;
      --signal-deep: #a02622;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--ink);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .redirect-card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
    }
    .redirect-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--signal);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 24px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: var(--signal-deep);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="/android-chrome-192x192.png" alt="RedBot" class="redirect-logo">
    <h1>Redirigiendo a Discord...</h1>
    <p>Te estamos llevando a la pantalla de autorización oficial de RedBot.</p>
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1020772849906098186">
      Haz clic aquí si no redirige automáticamente
    </a>
  </div>
</body>
</html>
